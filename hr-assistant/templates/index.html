<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ assistant_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="avatar avatar-bot">HR</div>
        <div>
          <h1>{{ assistant_name }}</h1>
          <p class="status"><span class="dot"></span> Online</p>
        </div>
      </div>
      <button id="clear-btn" class="ghost-btn" title="Clear chat">Clear</button>
    </header>

    <main id="messages" class="messages">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">👋</div>
        <h2>Hi, how can I help you today?</h2>
        <p>Ask me about leave policies, benefits, payroll, onboarding, and more.</p>
        <div class="suggestions">
          <button class="chip">How many paid leaves do I get?</button>
          <button class="chip">Explain the health insurance benefits</button>
          <button class="chip">How do I apply for work from home?</button>
          <button class="chip">When is payroll processed?</button>
        </div>
      </div>
    </main>

    <form id="chat-form" class="composer">
      <textarea id="user-input" rows="1" placeholder="Type your message…" autocomplete="off" required></textarea>
      <button id="send-btn" type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
    <p class="footnote">AI responses may be inaccurate. Verify important information with HR.</p>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const welcome = document.getElementById("welcome");

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function renderMarkdown(text) {
      if (window.marked && window.DOMPurify) {
        return DOMPurify.sanitize(marked.parse(text));
      }
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, "<br>");
    }

    function addMessage(role, content, { isError = false } = {}) {
      if (welcome) welcome.remove();
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role === "user" ? "avatar-user" : "avatar-bot"}`;
      avatar.textContent = role === "user" ? "You" : "HR";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = `bubble${isError ? " error" : ""}`;
      if (role === "user") {
        bubble.textContent = content;
      } else {
        bubble.innerHTML = renderMarkdown(content);
      }

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = timeNow();

      wrap.append(bubble, meta);
      row.append(avatar, wrap);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "message-row assistant";
      row.innerHTML = `
        <div class="avatar avatar-bot">HR</div>
        <div class="bubble-wrap"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    async function sendMessage(text) {
      addMessage("user", text);
      const typing = addTyping();
      sendBtn.disabled = true;
      try {
        const res = await fetch(`/chat?user_input=${encodeURIComponent(text)}`);
        if (!res.ok) throw new Error(`Server error (${res.status})`);
        const data = await res.json();
        typing.remove();
        addMessage("assistant", data.response);
      } catch (err) {
        typing.remove();
        addMessage("assistant", `Sorry, something went wrong: ${err.message}`, { isError: true });
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      autoResize();
      sendMessage(text);
    });

    input.addEventListener("input", autoResize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.textContent));
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      window.location.reload();
    });

    input.focus();
  </script>
</body>
</html>

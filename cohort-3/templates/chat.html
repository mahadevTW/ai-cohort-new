<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --panel-2: #1e2340;
      --border: #2a3052;
      --text: #e8eaf6;
      --muted: #8d93b8;
      --accent: #6c7bff;
      --accent-2: #9b6cff;
      --user-bubble: linear-gradient(135deg, var(--accent), var(--accent-2));
      --bot-bubble: #232948;
      --error: #ff6b81;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1d2350 0%, transparent 60%),
                  radial-gradient(1000px 500px at 100% 110%, #2a1a50 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .chat {
      width: 100%;
      max-width: 780px;
      height: min(88vh, 820px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 18px;
      background: var(--user-bubble);
      flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 8px #3ddc97; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    .row { display: flex; gap: 10px; max-width: 100%; animation: pop .22s ease-out; }
    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 6px 18px rgba(108, 123, 255, .3);
    }
    .assistant .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .assistant .bubble.error { color: var(--error); border-color: rgba(255, 107, 129, .4); }
    .mini-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; font-size: 14px;
      background: var(--user-bubble); flex-shrink: 0; align-self: flex-end;
    }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .empty .big { font-size: 40px; margin-bottom: 8px; }
    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    textarea {
      flex: 1;
      resize: none;
      max-height: 140px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 123, 255, .2); }
    textarea::placeholder { color: var(--muted); }
    button {
      height: 44px; width: 44px;
      border: none; border-radius: 12px;
      background: var(--user-bubble);
      color: #fff; font-size: 18px;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
      flex-shrink: 0;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: scale(.95); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
    @media (max-width: 520px) {
      body { padding: 0; }
      .chat { height: 100vh; max-height: none; border-radius: 0; border: none; }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header class="header">
      <div class="avatar">🤖</div>
      <div>
        <h1>{{ title }}</h1>
        <div class="status"><span class="dot"></span> Online</div>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="empty" id="empty">
        <div class="big">💬</div>
        Ask me anything to get started.
        
      </div>
    </section>

    <form id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text, { error = false } = {}) {
      document.getElementById("empty")?.remove();
      const row = document.createElement("div");
      row.className = `row ${role}`;
      if (role === "assistant") {
        const av = document.createElement("div");
        av.className = "mini-avatar";
        av.textContent = "🤖";
        row.appendChild(av);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (error ? " error" : "");
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function addTyping() {
      const row = addMessage("assistant", "");
      row.querySelector(".bubble").innerHTML =
        '<span class="typing"><span></span><span></span><span></span></span>';
      return row;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    async function send(text) {
      addMessage("user", text);
      input.value = "";
      autosize();
      sendBtn.disabled = true;
      const typing = addTyping();
      try {
        const res = await fetch("/chat?message=" + encodeURIComponent(text));
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        typing.remove();
        addMessage("assistant", data.message ?? "(empty response)");
      } catch (err) {
        typing.remove();
        addMessage("assistant", "Something went wrong: " + err.message, { error: true });
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text && !sendBtn.disabled) send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    input.addEventListener("input", autosize);

    async function loadHistory() {
      try {
        const res = await fetch("/messages");
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        for (const m of data.messages ?? []) {
          if ((m.role === "user" || m.role === "assistant") && m.content) {
            addMessage(m.role, m.content);
          }
        }
      } catch (err) {
        addMessage("assistant", "Could not load previous messages: " + err.message, { error: true });
      }
    }

    loadHistory();
  </script>
</body>
</html>

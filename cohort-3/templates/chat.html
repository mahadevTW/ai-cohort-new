<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --panel-2: #1e2340;
      --border: #2a3052;
      --text: #e8eaf6;
      --muted: #8d93b8;
      --accent: #6c7bff;
      --accent-2: #9b6cff;
      --user-bubble: linear-gradient(135deg, var(--accent), var(--accent-2));
      --bot-bubble: #232948;
      --error: #ff6b81;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1d2350 0%, transparent 60%),
                  radial-gradient(1000px 500px at 100% 110%, #2a1a50 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 1080px;
      height: min(88vh, 820px);
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel-2);
      border-right: 1px solid var(--border);
    }
    .sidebar-top { padding: 16px; border-bottom: 1px solid var(--border); }
    .new-chat {
      width: 100%;
      height: 42px;
      font-size: 14px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .conversations {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conversations::-webkit-scrollbar { width: 6px; }
    .conversations::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
    .conv {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .conv:hover { background: rgba(108, 123, 255, .08); }
    .conv.active { background: rgba(108, 123, 255, .16); border-color: rgba(108, 123, 255, .45); }
    .conv .conv-title {
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv .conv-time { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .conv-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 8px; }
    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .menu-toggle { display: none; }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 18px;
      background: var(--user-bubble);
      flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 8px #3ddc97; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    .row { display: flex; gap: 10px; max-width: 100%; animation: pop .22s ease-out; }
    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 6px 18px rgba(108, 123, 255, .3);
    }
    .assistant .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .assistant .bubble.error { color: var(--error); border-color: rgba(255, 107, 129, .4); }
    .mini-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; font-size: 14px;
      background: var(--user-bubble); flex-shrink: 0; align-self: flex-end;
    }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .empty .big { font-size: 40px; margin-bottom: 8px; }
    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    textarea {
      flex: 1;
      resize: none;
      max-height: 140px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 123, 255, .2); }
    textarea::placeholder { color: var(--muted); }
    form button, .new-chat, .menu-toggle {
      border: none; border-radius: 12px;
      background: var(--user-bubble);
      color: #fff; font-size: 18px;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
      flex-shrink: 0;
    }
    form button { height: 44px; width: 44px; }
    form button:hover:not(:disabled), .new-chat:hover { transform: translateY(-1px); }
    form button:active:not(:disabled), .new-chat:active { transform: scale(.97); }
    form button:disabled { opacity: .45; cursor: not-allowed; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
    @media (max-width: 760px) {
      body { padding: 0; }
      .app { height: 100vh; max-height: none; border-radius: 0; border: none; position: relative; }
      .sidebar {
        position: absolute; inset: 0 auto 0 0; z-index: 10;
        width: min(300px, 85vw);
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: 10px 0 40px rgba(0, 0, 0, .5);
      }
      .app.sidebar-open .sidebar { transform: none; }
      .menu-toggle {
        display: grid; place-items: center;
        width: 36px; height: 36px; font-size: 16px;
        background: var(--bot-bubble); border: 1px solid var(--border);
      }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <button type="button" class="new-chat" id="new-chat">＋ New conversation</button>
    </div>
    <nav class="conversations" id="conversations">
      <div class="conv-empty">Loading…</div>
    </nav>
  </aside>

  <main class="chat">
    <header class="header">
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Conversations">☰</button>
      <div class="avatar">🤖</div>
      <div>
        <h1>{{ title }}</h1>
        <div class="status"><span class="dot"></span> Online</div>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="empty" id="empty">
        <div class="big">💬</div>
        Ask me anything to get started.
        
      </div>
    </section>

    <form id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
  </main>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text, { error = false } = {}) {
      document.getElementById("empty")?.remove();
      const row = document.createElement("div");
      row.className = `row ${role}`;
      if (role === "assistant") {
        const av = document.createElement("div");
        av.className = "mini-avatar";
        av.textContent = "🤖";
        row.appendChild(av);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (error ? " error" : "");
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function addTyping() {
      const row = addMessage("assistant", "");
      row.querySelector(".bubble").innerHTML =
        '<span class="typing"><span></span><span></span><span></span></span>';
      return row;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    const appEl = document.getElementById("app");
    const convListEl = document.getElementById("conversations");
    const newChatBtn = document.getElementById("new-chat");
    const menuToggle = document.getElementById("menu-toggle");

    // null means "new conversation" — the backend creates one on the first /chat call
    let currentConversationId = null;
    // bumped on every conversation switch so in-flight responses don't land in the wrong chat
    let viewToken = 0;

    function showEmpty() {
      messagesEl.innerHTML =
        '<div class="empty" id="empty"><div class="big">💬</div>Ask me anything to get started.</div>';
    }

    function formatTime(value) {
      if (!value) return "";
      const d = new Date(value);
      return isNaN(d) ? "" : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    function renderConversations(conversations) {
      convListEl.innerHTML = "";
      if (!conversations.length) {
        convListEl.innerHTML = '<div class="conv-empty">No conversations yet.</div>';
        return;
      }
      for (const c of conversations) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "conv" + (String(c.id) === String(currentConversationId) ? " active" : "");
        item.dataset.id = c.id;
        const title = document.createElement("div");
        title.className = "conv-title";
        title.textContent = c.title || "Untitled conversation";
        title.title = c.title || "";
        const time = document.createElement("div");
        time.className = "conv-time";
        time.textContent = formatTime(c.time);
        item.append(title, time);
        item.addEventListener("click", () => openConversation(c.id));
        convListEl.appendChild(item);
      }
    }

    function highlightActive() {
      for (const el of convListEl.querySelectorAll(".conv")) {
        el.classList.toggle("active", el.dataset.id === String(currentConversationId));
      }
    }

    async function loadConversations() {
      try {
        const res = await fetch("/conversations");
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        const conversations = (data.conversations ?? [])
          .slice()
          .sort((a, b) => new Date(b.time) - new Date(a.time));
        renderConversations(conversations);
        return conversations;
      } catch (err) {
        convListEl.innerHTML = '<div class="conv-empty">Could not load conversations.</div>';
        return [];
      }
    }

    async function openConversation(id) {
      appEl.classList.remove("sidebar-open");
      if (String(id) === String(currentConversationId)) return;
      currentConversationId = id;
      const token = ++viewToken;
      highlightActive();
      messagesEl.innerHTML = "";
      sendBtn.disabled = false;
      try {
        const res = await fetch("/messages?conversation_id=" + encodeURIComponent(id));
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        if (token !== viewToken) return;
        const msgs = (data.messages ?? []).filter(
          (m) => (m.role === "user" || m.role === "assistant") && m.content
        );
        if (!msgs.length) showEmpty();
        for (const m of msgs) addMessage(m.role, m.content);
      } catch (err) {
        if (token !== viewToken) return;
        addMessage("assistant", "Could not load messages: " + err.message, { error: true });
      }
      input.focus();
    }

    function startNewConversation() {
      appEl.classList.remove("sidebar-open");
      currentConversationId = null;
      viewToken++;
      highlightActive();
      showEmpty();
      sendBtn.disabled = false;
      input.value = "";
      autosize();
      input.focus();
    }

    async function send(text) {
      addMessage("user", text);
      input.value = "";
      autosize();
      sendBtn.disabled = true;
      const typing = addTyping();
      const token = viewToken;
      const wasNew = currentConversationId == null;
      try {
        let url = "/chat?message=" + encodeURIComponent(text);
        if (!wasNew) url += "&conversation_id=" + encodeURIComponent(currentConversationId);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        if (wasNew) loadConversations();
        if (token !== viewToken) return; // user switched away while waiting
        if (data.conversation_id != null) currentConversationId = data.conversation_id;
        typing.remove();
        addMessage("assistant", data.message ?? "(empty response)");
        if (wasNew) highlightActive();
      } catch (err) {
        if (token !== viewToken) return;
        typing.remove();
        addMessage("assistant", "Something went wrong: " + err.message, { error: true });
      } finally {
        if (token === viewToken) {
          sendBtn.disabled = false;
          input.focus();
        }
      }
    }

    newChatBtn.addEventListener("click", startNewConversation);
    menuToggle.addEventListener("click", () => appEl.classList.toggle("sidebar-open"));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text && !sendBtn.disabled) send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    input.addEventListener("input", autosize);

    // On load: list conversations and open the most recent one (or stay on a fresh chat)
    loadConversations().then((conversations) => {
      if (conversations.length && currentConversationId == null && !sendBtn.disabled) {
        openConversation(conversations[0].id);
      }
    });
  </script>
</body>
</html>
